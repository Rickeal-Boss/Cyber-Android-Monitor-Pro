<style>
/* ═══ tokens 对齐 Color.kt (48 token 精简为 DOM 使用集) ═══ */
:root{
--bg:#F0F2EF;--card:#FFFFFF;--cardEnd:#FFFFFF;--muted:#EDEFEB;--pill:#F7F8F5;--elevated:#FFFFFF;
--purple:#4F7A70;--purpleBright:#6E9A8D;--purplePale:#E3EAE7;--purpleDeep:#3D6259;
--steel:#6E746D;--cyan:#5C8A7E;--magenta:#C77D9E;--deepPink:#C77D9E;
--success:#4CAF7D;--warning:#D4943A;--error:#D4574E;--gold:#C9A84C;
--txtP:#2B302D;--txtS:#6E746D;--onP:#FFFFFF;--divider:#E0E3DF;--trackC:#E8EAE6;
--pBlue:#3B6EA5;--pRed:#C25B3A;--pGreen:#2E8C7A;--pViolet:#7B6BA8;--pPink:#B85C7E;--pInk:#3A3A40;
--pBlueD:#2E567F;--pRedD:#A0472E;--pGreenD:#23685A;--pVioletD:#5F5286;--pPinkD:#9A4A63;--pInkD:#232327;
--shAmb:rgba(42,46,51,.05);--shSpot:rgba(42,46,51,.09);
}
[data-theme="dark"]{
--bg:#14161A;--card:#1E2226;--cardEnd:#1E2226;--muted:#2A2E33;--pill:#1E2226;--elevated:#25292D;
--purple:#8FBFB2;--purpleBright:#A9CFC4;--purplePale:#35423D;--purpleDeep:#6FA392;
--steel:#9AA39E;--cyan:#9FC9BE;--magenta:#E098B8;--deepPink:#E098B8;
--success:#6FCF97;--warning:#E8B05C;--error:#E8766E;--gold:#D4B86A;
--txtP:#E8EAE7;--txtS:#9AA39E;--onP:#14161A;--divider:#2A2E33;--trackC:#2A2E33;
--pBlue:#7FA8D0;--pRed:#E08A66;--pGreen:#6FBFAD;--pViolet:#AD9FD0;--pPink:#DA94AC;--pInk:#55555E;
--pBlueD:#9FC0E2;--pRedD:#EFA98C;--pGreenD:#8FD0C0;--pVioletD:#C4B8E6;--pPinkD:#F0BBD0;--pInkD:#6E6E78;
--shAmb:rgba(0,0,0,.28);--shSpot:rgba(0,0,0,.45);

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:#000;color:var(--txtP);overflow:hidden;user-select:none;-webkit-user-select:none;}
/* ★ 适配：dvh(dynamic viewport height) 需 Chrome 108+/Safari 15.4+，旧 WebView 与老国产 ROM
   浏览器不支持会让 #app 高度塌陷(整页空白)。先写 100vh 兜底，支持 dvh 的用后者覆盖(渐进增强)。 */
#app{height:100vh;height:100dvh;max-width:520px;margin:0 auto;display:flex;flex-direction:column;position:relative;background:var(--bg);overflow:hidden;box-shadow:0 0 60px rgba(0,0,0,.4);}
svg.ic{display:block;width:100%;height:100%;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;}
/* ══ 响应式适配（Material 3 窗口尺寸类 + 电视式全屏）══
   Compact   <600dp   → 手机：2 列，底部 tab，手机壳 520px
   Medium    600–839  → 平板：3 列网格 / 4 列快速访问
   Expanded  ≥840     → 桌面/电视：全屏铺满 + 多列 + 超大字号 + 焦点框导航（遥控/方向键友好）
   ≥1280             → 电视/大屏：进一步放大 */
@media (max-width:360px){
 .page{padding:12px;}
 .qcard{height:52px;padding:11px;}
 .qcard b{font-size:12px;}
 .qcard .qi{width:28px;height:28px;margin-right:9px;}
}
@media (max-height:640px){
 .pill{height:54px;}
 .header{padding:4px 6px 2px;}
}
@media (orientation:landscape) and (max-height:520px){
 .page{padding:10px;}
 .pill{height:46px;}
 .header{padding:2px 6px 2px;}
}

/* ── Compact <600dp（手机 fallback：默认 2 列）── */
@media (max-width:599px){
 .grid2{grid-template-columns:1fr 1fr;}
 .qgrid{grid-template-columns:1fr 1fr;}
}

/* ── Medium 600–839dp（平板）── */
@media (min-width:600px){
 #app{max-width:760px;}
 .page{padding:20px;}
 .grid2{grid-template-columns:repeat(3,1fr);gap:16px;}
 .qgrid{grid-template-columns:repeat(4,1fr);gap:14px;}
 .chartC{height:150px;}
 .mcard .val{font-size:24px;}
}

/* ── Expanded ≥840dp（桌面 / 电视：全屏铺满无留白）── */
@media (min-width:840px){
 #app{max-width:100%;box-shadow:none;}   /* 电视式：全屏铺满，去掉手机壳阴影 */
 html{font-size:17px;}                    /* 电视式：全局基准放大 */
 .page{padding:28px;max-width:1600px;margin:0 auto;width:100%;}
 .grid2{grid-template-columns:repeat(4,1fr);gap:20px;}
 .qgrid{grid-template-columns:repeat(6,1fr);gap:18px;}
 .qcard{height:68px;padding:16px;border-radius:22px;}
 .qcard .qi{width:40px;height:40px;margin-right:14px;}
 .qcard b{font-size:15px;}
 .qcard span{font-size:12px;}
 .chartC{height:180px;}
 .mcard .lab{font-size:13px;}
 .mcard .val{font-size:28px;}
 .stitle{font-size:18px;}
 .card{border-radius:24px;padding:22px;} /* 桌面/电视：覆盖层 fixed 覆盖整个 viewport（含 #app 外黑边）*/
 .ovl{position:fixed;}
 .pill{height:76px;}
 .tabrow{height:64px;}
 .tab{padding:9px 14px;}
 .tab .tname{font-size:14px;}
 .tab .tico{width:20px;height:20px;}
 /* 电视式：焦点框导航（遥控 / 键盘方向键友好）*/
 .qcard:focus-visible,.tab:focus-visible,.card:focus-visible,
 .seccard:focus-visible,[draggable="true"]:focus-visible{
  outline:3px solid var(--purpleBright);outline-offset:3px;}
}

/* ── 电视 / 大屏 ≥1280dp ── */
@media (min-width:1280px){
 html{font-size:19px;}
 .page{padding:36px;max-width:1920px;}
 .grid2{grid-template-columns:repeat(6,1fr);gap:24px;}
 .qgrid{grid-template-columns:repeat(8,1fr);gap:20px;}
 .chartC{height:220px;}
 .mcard .val{font-size:32px;}
}

/* ══ 药丸头部 ══ */
.header{flex:0 0 auto;padding:6px 6px 4px;position:relative;}
.pill{height:64px;border-radius:26px;position:relative;overflow:hidden;display:flex;align-items:center;padding:4px;z-index:1;}
.pill-bg{position:absolute;inset:0;background:linear-gradient(160deg,var(--card) 30%,var(--muted) 130%);}
.pill-sweep{position:absolute;inset:-40% -60%;background:linear-gradient(100deg,transparent,var(--purple) 20%,var(--purpleBright) 38%,transparent 55%);opacity:.10;animation:sweep 7s ease-in-out infinite alternate;}
@keyframes sweep{from{transform:translateX(-45%);}to{transform:translateX(60%);}}
.pill-ring{position:absolute;inset:0;border-radius:26px;border:1px solid var(--purple);opacity:.12;pointer-events:none;}
.tabrow{flex:1;display:flex;overflow-x:auto;scrollbar-width:none;height:54px;align-items:center;position:relative;z-index:2;margin-left:2px;}
.tabrow::-webkit-scrollbar{display:none;}
.tab{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 9px;border-radius:12px;cursor:pointer;transition:background .25s;position:relative;}
.tab .tico{width:17px;height:17px;color:var(--steel);opacity:.72;transition:.25s;}
.tab .tname{font-size:12.5px;color:var(--steel);opacity:.75;white-space:nowrap;}
.tab.on{background:color-mix(in srgb,var(--purple) 10%,transparent);}
.tab.on::after{content:"";position:absolute;left:27%;bottom:3px;width:46%;height:2px;border-radius:1px;background:var(--purple);}
.tab.on .tico,.tab.on .tname{color:var(--purple);opacity:1;font-weight:700;}
.gslot{width:36px;height:36px;margin-left:5px;flex:0 0 auto;position:relative;z-index:2;color:var(--txtS);}
.neondiv{height:1.5px;margin:0 6px;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--purpleDeep) 30%,transparent) 28%,color-mix(in srgb,var(--purple) 55%,transparent) 50%,color-mix(in srgb,var(--purpleDeep) 30%,transparent) 72%,transparent);}

/* ══ pager + stagger ══ */
#pager{flex:1;position:relative;overflow:hidden;touch-action:pan-y;}
#track{display:flex;height:100%;width:900%;will-change:transform;}
.page{width:calc(100%/9);min-width:calc(100%/9);height:100%;overflow-y:auto;overflow-x:hidden;padding:16px;scrollbar-width:thin;scrollbar-color:var(--divider) transparent;}
.page::-webkit-scrollbar{width:3px;}.page::-webkit-scrollbar-thumb{background:var(--divider);border-radius:2px;}
.swiper{will-change:transform,opacity;transform-origin:center;}

/* ══ cards ══ */
.card{background:linear-gradient(135deg,var(--card),var(--cardEnd));border-radius:20px;padding:18px;box-shadow:0 2px 6px var(--shAmb),0 1px 3px var(--shSpot);margin-bottom:18px;position:relative;overflow:hidden;}
@keyframes revIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.card.pin{border-radius:0;padding:0;height:.5px;background:var(--divider);margin:0 0 16px;box-shadow:none;}
.stitle{font-size:15px;font-weight:700;color:var(--txtP);margin:2px 0 8px;}
.msecT{font-size:16px;font-weight:500;color:var(--purple);margin:0 0 10px;}
.icard .row{display:flex;align-items:center;gap:12px;}
.icard .ico{width:40px;height:40px;border-radius:14px;background:var(--muted);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.icard .ico svg{width:22px;height:22px;}
.icard h2{font-size:17px;font-weight:700;color:var(--txtP);line-height:1.25;}
.icard .sub{font-size:13px;color:var(--txtS);margin-top:1px;}
.mcard .lab{font-size:11px;color:var(--txtS);letter-spacing:.4px;}
.mcard .val{font-size:22px;font-weight:700;letter-spacing:1px;margin-top:5px;font-variant-numeric:tabular-nums;line-height:1.25;white-space:pre-wrap;}
.prog{height:5px;border-radius:2.5px;background:var(--trackC);margin-top:10px;overflow:hidden;}
.prog>i{display:block;height:100%;border-radius:2.5px;transition:width .6s cubic-bezier(.4,0,.2,1);}
.minidiv{height:.5px;background:color-mix(in srgb,var(--muted) 40%,transparent);margin:11px 0 9px;}
.sublab{font-size:11px;color:color-mix(in srgb,var(--txtS) 70%,transparent);letter-spacing:.4px;}
.grid2{display:grid;gap:14px;margin-bottom:16px;}
.grid2>.card{margin-bottom:0;}
.qgrid{display:grid;gap:12px;}
.qcard{height:56px;border-radius:20px;background:linear-gradient(135deg,var(--card),var(--cardEnd));display:flex;align-items:center;padding:14px;cursor:pointer;box-shadow:0 2px 6px var(--shAmb);transition:transform .15s;}
.qcard:active{transform:scale(.96);}
.qcard .qi{width:32px;height:32px;border-radius:8px;background:var(--muted);display:flex;align-items:center;justify-content:center;margin-right:12px;flex:0 0 auto;}
.qcard .qi svg{width:16px;height:16px;}
.qcard b{font-size:13px;font-weight:600;color:var(--txtP);display:block;}
.qcard span{font-size:11px;color:var(--txtS);}
.chartC{width:100%;height:120px;display:block;margin-top:10px;}

/* device section card */
.dsec h3{font-size:14px;font-weight:600;color:var(--purple);margin-bottom:9px;}
.ritem{display:flex;padding:2.5px 0;font-size:13px;line-height:1.45;}
.ritem .k{color:var(--txtS);flex:0 0 34%;}
.ritem .v{flex:1;text-align:right;word-break:break-all;font-weight:500;}
.ritem.click{cursor:pointer;} .ritem.click:hover{opacity:.75;}
.rawp{padding:2px 0;}
.rawp .pk{color:color-mix(in srgb,var(--txtS) 60%,transparent);font-size:10.5px;display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rawp .pv{font-size:12px;color:var(--txtP);display:block;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.stepbig{text-align:center;padding:6px 0 2px;}
.stepbig b{font-size:36px;font-weight:700;color:var(--pGreenD);display:block;line-height:1.15;}
.stepbig span{font-size:11px;color:var(--txtS);}
.chip{padding:7px 15px;border-radius:18px;background:var(--muted);font-size:12.5px;color:var(--txtS);cursor:pointer;border:none;}
.chip.on{background:color-mix(in srgb,var(--purple) 20%,transparent);color:var(--purple);font-weight:600;}
</style>
<style>
/* ══ M3 checkbox / FancySlider / joystick / overlays ══ */
.cbitem{display:flex;align-items:center;padding:5px 0;cursor:pointer;font-size:15px;color:var(--txtP);}

.fslider{position:relative;height:38px;border-radius:19px;touch-action:none;margin-top:8px;}

.fslider .thumb{position:absolute;top:0;width:48px;height:38px;display:flex;align-items:center;justify-content:center;pointer-events:none;transform:translateX(-50%);}

dialog.pick{border:none;border-radius:26px;background:var(--elevated);color:var(--txtP);padding:22px;max-width:310px;width:88vw;box-shadow:0 18px 50px rgba(0,0,0,.35);}

.fp-on .fw{display:block;}

.btnp,.btno{flex:1;padding:10px 4px;border-radius:22px;font-size:13.5px;cursor:pointer;}
/* F5 卡片缩放转场 — MainActivity.kt:602-720 参数（scale .3→1 中心锚定 / scrim .22 二次曲线 / 内容渐入上移24px / 进550出450，scrim 与容器解耦） */
.ovl.cardmode{background:transparent;}
.ovl.cardmode::before{content:"";position:absolute;inset:0;background:#000;opacity:0;transition:opacity .45s cubic-bezier(.4,0,.2,1);}
/* ★ 适配：去掉所有 transition delay (.3s / .14s / .12s)。真实浏览器在 delay 期间会看到
   "scrim 半透明 + 内容半缩放"的展开中状态（即用户反馈的"覆盖层展开不完全"）。 */
/* ★ BUGFIX (F-27): 覆盖层"全透"真因。
   原实现把不透明背板交给 .cardbg(position:absolute; inset:0)。但 .ovl 是滚动容器
   (overflow-y:auto)，absolute 子元素的包含块是 .ovl 的 **padding box（可视区）**而非
   滚动内容区 —— 实测 scrollH=993 / clientH=802，cardbg 只有 802px 高，一滚到底
   下方 191px 完全没有背板；而 .ovl 自身 background:transparent、::before scrim 仅
   rgba(0,0,0,.22)，于是下方主界面完全透出来 —— 用户报"全透、与主界面完全可见重叠"。
   修法：把背板交给 .ovl 自身 —— 滚动容器的背景绘制在 padding box 且**不随内容滚动**，
   任何滚动位置都不会露底。cardbg 降级为淡入动画层。 */
.ovl.cardmode{background:transparent;transition:background-color .35s cubic-bezier(.4,0,.2,1);}
.ovl.cardmode.open{background:var(--card);}
/* 支持 color-mix 的浏览器保留 94% 半透质感（较原 92% 更实，避免"太透"） */
@supports (background: color-mix(in srgb, red 50%, transparent)){
 .ovl.cardmode.open{background:color-mix(in srgb, var(--card) 94%, transparent);}
}
.ovl.cardmode.open::before{opacity:1;transition:opacity .25s cubic-bezier(.4,0,.2,1);}
.ovl.cardmode::before{background:rgba(0,0,0,.22);}
.ovl.cardmode .cardbg{position:absolute;inset:0;background:var(--card);opacity:0;transition:opacity .45s cubic-bezier(.4,0,.2,1);}
.ovl.cardmode.open .cardbg{opacity:.94;transition:opacity .55s cubic-bezier(.4,0,.2,1) .3s;}
.ovl.cardmode .ovl-inner{transform:scale(.3) translateY(24px);opacity:0;transform-origin:50% 40%;transition:transform .3s cubic-bezier(.4,0,.2,1),opacity .3s cubic-bezier(.4,0,.2,1);}
.ovl.cardmode.open .ovl-inner{transform:none;opacity:1;transition:transform .35s cubic-bezier(.4,0,.2,1),opacity .35s cubic-bezier(.4,0,.2,1);}
/* ══ HDR 实验室 (对齐 HdrLabScreen.kt line 151-412 / 488-570) ══ */
.hlcard{border-radius:20px;padding:16px;margin-bottom:16px;position:relative;
 background:linear-gradient(135deg,color-mix(in srgb,var(--purple) 13%,var(--card)),var(--cardEnd));

/* ★ F-29 半透明强化：真·毛玻璃（acrylic）。
   与 F-27 修的"全透"区别：之前是【完全透明、能看清主界面每个字】；现在是【能感知到下层
   有内容但被 26px 高斯模糊化】—— 用户要的"更强化"的半透明层次感，而非穿透感。
   ⚠️ 顺序铁律：本块必须放在上面 .ovl.cardmode.open/.cardbg 定义**之后**，
   否则同 specificity 下会被后面的 opacity:.94 覆盖（实测踩过，cardbg 卡在 0.94 把毛玻璃压死）。
   cardbg 必须降到极低：.ovl 78% + cardbg 94% 的合成不透明度 = 1-(0.22*0.06) ≈ 98.7%，
   blur 几乎看不出来；降到 .22 后合成 ≈ 1-(0.22*0.78) ≈ 82.8%，模糊层次才显现。
   scrim 玻璃模式降到 .3：原 .22 黑在 cardbg .22 之上合成有效黑约 17.2%，面板明显变灰；
   降到 .3 后有效黑约 6.6%，合成回 ~#EFEFEF 朦胧明亮。
   兼容性：backdrop-filter (Chrome 76+/Safari 9+) 与 color-mix (Chrome 111+/Safari 16.4+) 落地
   时间不同，需嵌套 @supports —— 不支持 color-mix 时回落 rgba(255,255,255,.78) 硬编码；
   不支持 backdrop-filter 时回落 94% 半实色（外层 fallback）。 */
@supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))){
 /* 兜底：纯 rgba(255,255,255,.78) 给不支持 color-mix 的浏览器（Chrome 76–110 / Safari 9–16.1） */
 .ovl.cardmode.open{background:rgba(255,255,255,.78);}
 @supports (background: color-mix(in srgb, red 50%, transparent)){
  .ovl.cardmode.open{
   background:color-mix(in srgb, var(--card) 78%, transparent);
   -webkit-backdrop-filter:blur(26px) saturate(1.3);
   backdrop-filter:blur(26px) saturate(1.3);
  }
 }
 .ovl.cardmode.open .cardbg{opacity:.22;}
 .ovl.cardmode.open::before{opacity:.3;}    /* 玻璃模式 scrim 减半，避免面板变灰 */
}

 g.addColorStop(0,'rgba(255,255,255,.18)');g.addColorStop(1,'rgba(255,255,255,0)');
 ctx.beginPath();ctx.arc(cX,cY,r,0,7);ctx.fillStyle=g;ctx.fill();
 ctx.beginPath();ctx.arc(cX,cY,r,0,7);ctx.fillStyle='rgba(250,252,255,.07)';ctx.fill(); // L4
 arcRing('#E8F4FC',.30,.8,200,150,2.2);      // L5 顶部镜面高光
 arcRing('#D0EFFF',.10,2.0,195,165,1.0);
 arcRing('#FFFFFF',.60,.6,145,150,1.4);      // L6 rim light 上亮下暗
 arcRing('#FFFFFF',.14,.6,295,130,1.4);
 arcRing('#000000',.08,3.5,100,140,2.0);     // L7 底部暗角
 arcRing('#000000',.03,6.0,90,160,0);
 g=ctx.createRadialGradient(cX,s*.82,0,cX,s*.82,s*.50);             // L8 底部黑色强调
 g.addColorStop(0,'rgba(0,0,0,.55)');g.addColorStop(.5,'rgba(0,0,0,.20)');g.addColorStop(1,'rgba(0,0,0,0)');
 ctx.beginPath();ctx.arc(cX,cY,r,0,7);ctx.fillStyle=g;ctx.fill();
}

/* ══════════ GlassCircleButton — 弹簧缩放 0.88x ══════════ */
class GlassBtn{
 constructor(el,sizePx,iconName,iconPx,tintGetter){
  this.el=el;this.s=sizePx;this.icon=iconName;this.ip=iconPx;this.tint=tintGetter||(()=>TOK.txtS||'#888');
  this.sc=1;this.tgt=1;
  el.classList.add('slot');
  const cv=document.createElement('canvas');cv.width=sizePx*2;cv.height=sizePx*2;
  el.appendChild(cv);this.cv=cv;this.ctx=cv.getContext('2d');
  this.bind();this.paint();
 }
 bind(){
  this.el.style.cursor='pointer';
  this.el.addEventListener('pointerdown',e=>{this.tgt=.88;this._act=e.pointerId;e.preventDefault();});
  const up=e=>{if(this._act!==undefined&&e.pointerId===this._act){this._act=undefined;if(this.tgt<1){this.tgt=1;this.cb&&this.cb();}}};
  window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
 }
 paint(){const c=this.ctx;if(!c)return;c.setTransform(2,0,0,2,0,0);
  if(_tokStale)refreshTok();
  drawGlass(c,this.s,false,0);
  c.save();c.translate((this.s-this.ip)/2,(this.s-this.ip)/2);
  c.strokeStyle=this.tint();drawIco(c,this.icon,this.ip);c.restore();}
}
GlassBtn.prototype.cb=null;
Object.defineProperty(GlassBtn.prototype,'onClick',{set:function(f){this.cb=f;}});

/* ══════════ LightCircleBackButton — 果冻拖拽返回键 V3 ══════════ */
class BackBtn{
 constructor(el,sizePx,onCommit){
  this.el=el;this.s=sizePx;this.onCommit=onCommit;
  this.dx=0;this.dy=0;this.active=false;this.stretch=0;this.tx=0;this.ty=0;
  el.classList.add('slot');
  const cv=document.createElement('canvas');cv.width=sizePx*2;cv.height=sizePx*2;
  cv.style.touchAction='none';el.appendChild(cv);
  this.cv=cv;this.ctx=cv.getContext('2d');
  this.th=Math.round(sizePx*(40/48)*1.15);   // CANCEL_THRESHOLD 40dp 比例换算
  this.bind();this.loop();
 }
 bind(){
  const cv=this.cv;let pid=null,ox=0,oy=0;
  cv.addEventListener('pointerdown',e=>{
   _tokStale&&refreshTok();
   this.active=true;pid=e.pointerId;ox=e.clientX;oy=e.clientY;this.dx=this.dy=0;
   try{navigator.vibrate&&navigator.vibrate(8);}catch(_){}
   try{cv.setPointerCapture&&cv.setPointerCapture(pid);}catch(_){}});
  cv.addEventListener('pointermove',e=>{if(pid===null||e.pointerId!==pid)return;
   this.dx=e.clientX-ox;this.dy=e.clientY-oy;});
  const fin=()=>{if(!this.active)return;this.active=false;
   const dist=Math.hypot(this.dx,this.dy);
   if(dist<this.th)setTimeout(()=>this.onCommit&&this.onCommit(),40);
   else{try{navigator.vibrate&&navigator.vibrate(4);}catch(_){}}
   this.dx=this.dy=0;};
  cv.addEventListener('pointerup',fin);cv.addEventListener('pointercancel',fin);
 }
 loop(){
  const k=.15,maxOff=this.s/2;                                  // tanh 饱和位移
  const tTx=this.active?maxOff*Math.tanh(k*this.dx/maxOff):0;
  const tTy=this.active?maxOff*Math.tanh(k*this.dy/maxOff):0;
  this.tx+=(tTx-this.tx)*(this.active?.55:.30);
  this.ty+=(tTy-this.ty)*(this.active?.55:.30);
  const nTgt=(this.active&&Math.hypot(this.dx,this.dy)>this.s*.03)?clamp(Math.hypot(this.dx,this.dy)/this.th,0,1):0;
  this.stretch+=(nTgt-this.stretch)*(this.active?.5:.26);
  this.render();requestAnimationFrame(()=>this.loop());
 }
 render(){
  const c=this.ctx;if(!c)return;
  const s=this.s,n=clamp(this.stretch,0,1);
  if(_tokStale)refreshTok();
  c.setTransform(2,0,0,2,0,0);
  c.save();c.translate(s/2+this.tx,s/2+this.ty);
  let sx=1,sy=1;
  if(n>.001){const ang=Math.atan2(this.dy,this.dx||1e-6);const ca=Math.cos(ang),sa=Math.sin(ang);
   const aL=1+.48*n,aP=1-.11*n;                                // MAX 1.48 / MIN 0.89
   sx=clamp(aL*ca*ca+aP*sa*sa,.75,1.48);sy=clamp(aL*sa*sa+aP*ca*ca,.75,1.48);}
  c.translate(-s/2,-s/2);c.scale(sx,sy);
  drawGlass(c,s,true,n);                                       // 无旋转形变层 (cos²/sin² 分解)
  c.restore();
  // 三层模糊箭头 soft-focus — 图标在形变层之外，不拉伸、只跟随位移
  const ip=s*.44,alphaBase=clamp(.62+.33*(1-clamp(this.stretch/.7,0,1)),.40,.95);
  [[1.40,.8,.14],[1.12,.4,.32],[1.0,0,1]].forEach(([mul,off,aw])=>{
   c.save();c.translate(this.tx+off,this.ty+off);
   c.globalAlpha=clamp(alphaBase*aw,0,1)*(aw===1?1:.75);
   const sz=s*.44*mul;c.translate(s/2-sz/2,s/2-sz/2);
   c.strokeStyle='#1A1A2E';drawIco(c,'arrow_back',sz);c.restore();});
  // 拖拽高光弧线 V2 — 冷调三层 (细 / 散射 / 环境晕)
  if(n>.08){
   const angDeg=(Math.atan2(this.dy,this.dx||1e-6)*180/Math.PI+360)%360;
   const hl=(angDeg+180)%360,sw=80*n,R=s/2*.96;
   [['#E8F4FC',.40,1.2,0],['#D0EFFF',.14,3.0,5],['#FFFFFF',.04,7,10]].forEach(([cl,a,w,ext])=>{
    c.beginPath();c.arc(s/2,s/2,R,(hl-sw/2-ext-90)*Math.PI/180,(hl+sw/2+ext-90)*Math.PI/180);
    c.strokeStyle=rgbaOf(cl,a*n);c.lineWidth=w;c.lineCap='butt';c.stroke();});
  }
 }
}

<script>
"use strict";
/* ══════════ CyberJoystickSwitch — 斜切轨道 + 弧线玻璃球 (CyberJoystickSwitch.kt) ══════════ */
class JoySwitch{
 constructor(host,checked,onCh){
  this.host=host;this.checked=!!checked;this.onCh=onCh||(()=>{});
  this.p=this.checked?1:0;this.dragging=false;this.press=false;
  host.classList.add('joy');
  const cv=document.createElement('canvas');cv.width=104;cv.height=64;
  host.appendChild(cv);this.cv=cv;this.ctx=cv.getContext('2d');
  this.bind(cv);
  const loopStep=()=>{if(!this._animating)this.render();requestAnimationFrame(loopStep);};
  requestAnimationFrame(loopStep);
  setInterval(()=>{if(!_tokStale&&!this._animating&&!this.dragging)this.render();},120);
 }
 bind(cv){
  cv.style.touchAction='pan-y';
  let base=0,acc=0,down=false,ox=null,lastX=null;
  cv.addEventListener('pointerdown',e=>{_tokStale&&refreshTok();
   down=true;base=this.p;acc=0;ox=e.clientX;lastX=e.clientX;this.press=true;
   try{navigator.vibrate&&navigator.vibrate(6);}catch(_){}
   try{cv.setPointerCapture&&cv.setPointerCapture(e.pointerId);}catch(_){}e.preventDefault();});
  cv.addEventListener('pointermove',e=>{
   if(!down)return;
   acc+= e.clientX-lastX;lastX=e.clientX;this.dragging=true;
   this.p=clamp(base+acc/24,0,1);this.render();});
  const fin=()=>{if(!down)return;down=false;this.press=false;ox=lastX=null;
   if(this.dragging){this.dragging=false;
    const go=this.p>.5;
    if(go!==this.checked){this.checked=go;navigator.vibrate&&navigator.vibrate(8);this.onCh(go);}
    this.animTo(this.checked?1:0);}
   else{this.checked=!this.checked;navigator.vibrate&&navigator.vibrate(8);
    this.animTo(this.checked?1:0);this.onCh(this.checked);}};
  cv.addEventListener('pointerup',fin);cv.addEventListener('pointercancel',fin);
 }
 animTo(t){ // DampingRatioMediumBouncy 近似 — 过冲弹簧
  cancelAnimationFrame(this._raf);this._animating=true;
  let v=(t-this.p)*.12+((this.checked)?0:0),cur=this.p,l=t0();
  const step=()=>{const now=t0(),dt=Math.min(.034,(now-l)/1000);l=now;
   v+= -(cur-t)*(9.5)*dt; v*=Math.pow(.90,dt*60);
   cur+=v*dt*7.5;
   this.p=clamp(cur,0,1);this.render();
   if(Math.abs(cur-t)<.005&&Math.abs(v)<.02){this.p=t;this.render();this._animating=false;return;}
   this._raf=requestAnimationFrame(step);};
  this._raf=requestAnimationFrame(step);
 }
 render(){
  const c=this.ctx;if(!c)return;
  c.setTransform(2,0,0,2,0,0);
  c.clearRect(0,0,52,32);
  const p=this.p,sinP=Math.sin(p*Math.PI);
  refreshIfNeededTok();
  const colOn=TOK.deepPink,colOff=TOK.steel;
  const tc=mixHex(colOff,colOn,p);
  const W=52,H=32,thumbR=H*.40,skewPx=H*.15;
  const thSx=skewPx*.5+thumbR*1.1,thEx=W-skewPx*.5-thumbR*1.1,arcPx=4;
  // T1 轨道底色 (斜切平行四边形)
  c.beginPath();c.moveTo(skewPx,0);c.lineTo(W,0);c.lineTo(W-skewPx,H);c.lineTo(0,H);c.closePath();
  let g=c.createLinearGradient(0,0,W,H);
  g.addColorStop(0,rgbaOf(tc,.45));g.addColorStop(.5,rgbaOf(tc,.25));g.addColorStop(1,rgbaOf(tc,.45));
  c.fillStyle=g;c.fill();
  // T2 内阴影
  g=c.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'rgba(0,0,0,.12)');g.addColorStop(.5,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.06)');
  c.fillStyle=g;c.fill();
  // T3 描边
  c.strokeStyle=rgbaOf(tc,.65);c.lineWidth=1;c.stroke();
  // T4 方向标记点
  c.fillStyle=rgbaOf(colOff,.5*(1-p));
  c.beginPath();c.arc(skewPx*.5+H*.12,H/2,H*.06,0,7);c.fill();
  c.fillStyle=rgbaOf(colOn,.5*p);
  c.beginPath();c.arc(W-skewPx*.5-H*.12,H/2,H*.06,0,7);c.fill();
  // 光晕拖尾 trailAlpha = sin(pπ)*.35
  const trailA=sinP*.35;
  if(trailA>.01){
   const thX=thSx+(thEx-thSx)*p,thY=H/2-sinP*arcPx;
   const dirSign=this.checked?-1:1;
   const tg=c.createLinearGradient(thX,thY,thX+dirSign*thumbR*1.5,thY);
   tg.addColorStop(0,rgbaOf(mixHex(colOff,colOn,p),trailA));tg.addColorStop(1,'rgba(0,0,0,0)');
   c.strokeStyle=tg;c.lineWidth=thumbR*.6;c.lineCap='round';
   c.beginPath();c.moveTo(thX,thY);c.lineTo(thX+dirSign*thumbR*1.5,thY);c.stroke();}
  // Thumb 玻璃球 — translationX/Y + rotationY(压扁模拟) + pulse/press 缩放
  const pressK=this.press?.9:1;
  const tilt=Math.cos(sinP*(24*Math.PI/180));           // rotationY 投影近似
  const tx=thSx-thumbR+(thEx-thSx)*p, ty=H/2-thumbR-sinP*arcPx;
  c.save();c.translate(tx+thumbR,ty+thumbR);
  c.scale(pressK*Math.max(.2,tilt),pressK);
  c.translate(-thumbR,-thumbR);
  let rg;
  rg=c.createRadialGradient(thumbR,thumbR,0,thumbR,thumbR,thumbR*1.4);      // L1 外光晕
  rg.addColorStop(0,rgbaOf(tc,.30));rg.addColorStop(1,'rgba(0,0,0,0)');
  c.fillStyle=rg;c.fillRect(-2,-2,52,36);
  rg=c.createRadialGradient(thumbR*.75,thumbR*.7,thumbR*.08,thumbR*.75,thumbR*.7,thumbR*1.1);  // L2 主体
  rg.addColorStop(0,rgbaOf(tc,.95));rg.addColorStop(.55,rgbaOf(tc,.60));rg.addColorStop(1,rgbaOf(tc,.85));
  c.beginPath();c.arc(thumbR,thumbR,thumbR,0,7);c.fillStyle=rg;c.fill();
  rg=c.createRadialGradient(thumbR*.68,thumbR*.62,0,thumbR*.68,thumbR*.62,thumbR*.5);          // L3 高光点
  rg.addColorStop(0,'rgba(255,255,255,.6)');rg.addColorStop(.6,'rgba(255,255,255,.15)');rg.addColorStop(1,'rgba(255,255,255,0)');
  c.fillStyle=rg;c.beginPath();c.arc(thumbR*.68,thumbR*.62,thumbR*.5,0,7);c.fill();
  rg=c.createRadialGradient(thumbR,thumbR*1.3,0,thumbR,thumbR*1.3,thumbR*.7);                  // L4 底部暗角
  rg.addColorStop(0,'rgba(0,0,0,.25)');rg.addColorStop(1,'rgba(0,0,0,0)');
  c.fillStyle=rg;c.beginPath();c.arc(thumbR,thumbR*1.3,thumbR*.7,0,7);c.fill();
  c.strokeStyle=rgbaOf(tc,.40);c.lineWidth=.8;                          // L5 边缘描边
  c.beginPath();c.arc(thumbR,thumbR,thumbR,0,7);c.stroke();
  c.strokeStyle='rgba(255,255,255,.25)';c.lineWidth=1.4;                // L6 顶部反光弧
  c.beginPath();c.arc(thumbR,thumbR,thumbR*.88,Math.PI*1.11,Math.PI*1.89);c.stroke();
  c.restore();
 }
}
function t0(){return performance.now();}
function refreshIfNeededTok(){if(_tokStale)refreshTok();}

/* ══════════ FancySlider — 厚胶囊轨道 + 齿轮旋转 thumb (FancySlider.kt) ══════════ */
class FancySlider{
 constructor(host,opt){
  opt=Object.assign({min:0,max:1,value:.5,onInput:null,onFinish:null,active:null,inactive:null,border:null,degrees:1080},opt);
  Object.assign(this,opt);
  this.host=host;host.classList.add('fslider');
  host.innerHTML='<div class="trk"><div class="fill"></div></div><div class="rim"></div>'+
   '<div class="thumb">'+svgIco('settings')+'</div>';
  this.fill=host.querySelector('.fill');this.thumbEl=host.querySelector('.thumb');
  this.gearEl=this.thumbEl.querySelector('svg');
  this.paint();this.bind();
 }
 paint(){
  _tokStale&&refreshTok();
  const fr=clamp((this.value-this.min)/((this.max-this.min)||1),0,1);this.frac=fr;
  this.fill.style.width=(fr*100)+'%';
  this.thumbEl.style.left=(fr*100)+'%';
  this.gearEl.style.transform='rotate('+(this.degrees*fr)+'deg)';
  this.fill.style.background=this.active||TOK.deepPink;
 }
 bind(){
  const drag=e=>{const r=this.host.getBoundingClientRect();
   const v=this.min+clamp((e.clientX-r.left)/r.width,0,1)*(this.max-this.min);
   this.value=v;this.paint();this.onInput&&this.onInput(v);};
  let on=false;
  this.host.addEventListener('pointerdown',e=>{on=true;
   try{this.host.setPointerCapture&&this.host.setPointerCapture(e.pointerId);}catch(_){}
   drag(e);});
  this.host.addEventListener('pointermove',e=>on&&drag(e));
  const up=()=>{if(on){on=false;this.onFinish&&this.onFinish(this.value);}};
  this.host.addEventListener('pointerup',up);this.host.addEventListener('pointercancel',up);
  this.host.style.cursor='pointer';
 }
 setValue(v){this.value=clamp(v,this.min,this.max);this.paint();}
}

/* ══════════ Chart — LineChart / DualLineChart (BezierCurveCanvas) ══════════ */
function chartCtx(cv){const dpr=window.devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;
 if(!w||!h)return null;
 cv.width=w*dpr;cv.height=h*dpr;const c=cv.getContext('2d');
 c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,w,h);return{c,w,h};}
function drawLineChart(cv,data,color,areaA){
 const o=chartCtx(cv);if(!o)return;_tokStale&&refreshTok();
 const{c,w,h}=o,pad=8,cw=w-pad*2,ch=h-pad*2;
 c.strokeStyle=TOK.divider;c.lineWidth=.5;
 for(let i=0;i<=5;i++){const y=pad+ch/5*i;c.beginPath();c.moveTo(pad,y);c.lineTo(w-pad,y);c.stroke();}
 if(data.length<2)return;
 const xs=[],ys=[];
 data.forEach((v,i)=>{xs.push(pad+cw/(data.length-1)*i);ys.push(pad+ch-clamp(v,0,1)*ch);});
 c.beginPath();c.moveTo(xs[0],h-pad);c.lineTo(xs[0],ys[0]);
 for(let i=1;i<xs.length;i++){const cx=xs[i-1]+(xs[i]-xs[i-1])*.5;
  c.bezierCurveTo(cx,ys[i-1],cx,ys[i],xs[i],ys[i]);}
 c.lineTo(xs[xs.length-1],h-pad);c.closePath();
 const ag=c.createLinearGradient(0,pad,0,h-pad);
 ag.addColorStop(0,rgbaOf(color,(areaA??0.16)));ag.addColorStop(1,rgbaOf(color,0));
 c.fillStyle=ag;c.fill();
 c.beginPath();c.moveTo(xs[0],ys[0]);
 for(let i=1;i<xs.length;i++){const cx=xs[i-1]+(xs[i]-xs[i-1])*.5;
  c.bezierCurveTo(cx,ys[i-1],cx,ys[i],xs[i],ys[i]);}
 c.strokeStyle=color;c.lineWidth=2.6;c.lineCap='round';c.stroke();
 c.fillStyle=color;c.beginPath();c.arc(xs[xs.length-1],ys[ys.length-1],3.5,0,7);c.fill();
}
function drawDualLineChart(cv,d1,c1,d2,c2){
 const o=chartCtx(cv);if(!o)return;_tokStale&&refreshTok();
 const{c,w,h}=o,pad=8,cw=w-pad*2,ch=h-pad*2;
 c.strokeStyle=TOK.divider;c.lineWidth=.5;
 for(let i=0;i<=5;i++){const y=pad+ch/5*i;c.beginPath();c.moveTo(pad,y);c.lineTo(w-pad,y);c.stroke();}
 const mx=Math.max(d1.length,d2.length);if(mx<2)return;
 const xStep=cw/(mx-1);
 [[d1,c1,2.4],[d2,c2,1.8]].forEach(([dd,col,lw])=>{
  if(dd.length<2)return;
  c.beginPath();
  for(let i=0;i<dd.length;i++){
   const x=pad+xStep*i,y=pad+ch-clamp(dd[i],0,1)*ch;
   if(i===0)c.moveTo(x,y);
   else{const cxm=pad+xStep*(i-.5),yp=pad+ch-clamp(dd[i-1],0,1)*ch;
    c.bezierCurveTo(cxm,yp,cxm,y,x,y);}}
  c.strokeStyle=col;c.lineWidth=lw;c.lineCap='round';c.stroke();});
}
/* SensorLineChart / MultiAxisChart — 带坐标区背景与端点光环 */
function drawAxisChart(cv,seriesArr,colors){
 const o=chartCtx(cv);if(!o)return;_tokStale&&refreshTok();
 const{c,w,h}=o,pad=14,leftPad=38,cw=w-pad-leftPad,ch=h-pad*2;
 c.fillStyle=rgbaOf(TOK.card,.25);c.fillRect(leftPad,pad,cw+pad,ch);
 c.strokeStyle=rgbaOf(TOK.cyan,.12);c.lineWidth=.5;
 for(let i=0;i<=4;i++){const y=pad+ch/4*i;c.beginPath();c.moveTo(leftPad,y);c.lineTo(w-pad,y);c.stroke();}
 c.strokeStyle=rgbaOf(TOK.purple,.45);c.lineWidth=1.5;
 c.beginPath();c.moveTo(leftPad,pad);c.lineTo(leftPad,pad+ch);c.moveTo(leftPad,pad+ch);c.lineTo(w-pad,pad+ch);c.stroke();
 const flat=[];seriesArr.forEach(s=>s.forEach(p=>flat.push(p.v)));
 if(!flat.length)return;
 const mn=Math.min(...flat),rg=Math.max(Math.max(...flat)-mn,.001);
 seriesArr.forEach((ser,si)=>{
  if(ser.length<2)return;
  const col=colors[si]||TOK.purpleBright;
  const pts=ser.map((pt,i)=>[leftPad+cw/(ser.length-1)*i,pad+ch-clamp((pt.v-mn)/rg,0,1)*ch]);
  c.beginPath();c.moveTo(pts[0][0],pad+ch);c.lineTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++){const cx=pts[i-1][0]+(pts[i][0]-pts[i-1][0])*.5;
   c.bezierCurveTo(cx,pts[i-1][1],cx,pts[i][1],pts[i][0],pts[i][1]);}
  c.lineTo(pts[pts.length-1][0],pad+ch);c.closePath();
  c.fillStyle=rgbaOf(col,.07);c.fill();

 const d=makeCard('dsec reveal','<h3>'+title+'</h3>'+body);attachCascade(d,idx);return d;}
function rowH(k,v,col,clickable){
 return '<div class="ritem'+(clickable?' click" onclick="'+clickable+'"':'"')+'><span class="k">'+k+'</span><span class="v" style="color:var(--'+(col||'purpleBright')+')">'+v+'</span></div>';}
function battTempBorder(t){if(t==null||isNaN(t))return null;
 _tokStale&&refreshTok();return t>44?TOK.error:t>40?TOK.gold:null;}

/* ══════════ 页面构建 (与 *Screen.kt 布局/色彩一一对应) ══════════ */
const BUILDERS={};let cpuMode=0;

/* — Dashboard — */
BUILDERS.dashboard=function(el){
 let ix=0;_tokStale&&refreshTok();
 const ic=infoCard(ix++,'<span data-live-key="dashTitle"></span>',
  '<span>'+t('dashboard_uptime_prefix')+' '+SIM.uptime+'</span>&nbsp;&nbsp;·&nbsp;&nbsp;<span>'+t('dashboard_deep_sleep_prefix')+' '+SIM.deepSleepUp+'</span>','home','var(--purple)');
 el.appendChild(ic);
 el.appendChild((function(){var hb=document.createElement('div');hb.id='hbSlot';return hb;})());
 el.appendChild(pinDiv(ix++));
 // 2x2 实时指标网格
  const MDEF=[
  ['cpuT',()=>mgrid(t('cpu_temperature_title'),'<span data-live-tk="cpuTemp"></span>','--pRedD',{chart:'cpuTemp:pRed'})],
  ['mem',()=>mgrid(t('dashboard_memory_usage_title'),'<span data-live-tk="ram"></span>','--purpleBright',{prog:()=>SIM.mem.usedKB/SIM.mem.totalKB,sub:'/ '+fmtBytes(SIM.mem.totalKB)})],
  ['batt',()=>mgrid(t('dashboard_battery_level_title'),'<span data-live-tk="battLvl"></span>','--success',{bottom:{label:t('battery_temperature_title'),id:'db_bt'},batt:1})],
  ['gpu',()=>mgrid(t('gpu_load_title'),'<span data-live-tk="gpuLoadPct"></span>','--pVioletD',{chart:'gpuLoad:pViolet'})]];
 const mOrder=loadOrder('camp_morder',['cpuT','mem','batt','gpu']);
 const g=document.createElement('div');g.className='grid2';
 g.innerHTML=mOrder.map(function(k){var f=MDEF.find(function(d){return d[0]===k;});
  return '<div class="mwrap" data-mkey="'+k+'" draggable="true">'+f[1]()+
   '<span class="draghandle">'+svgIco('drag')+'</span></div>';}).join('');
 el.appendChild(g);
 bindDashDnD(el,'mwrap','data-mkey',mOrder,function(){rerenderDash();},'camp_morder');
 // 手动补温度/GPU 图 canvas 引用占位(上面 html 内无 id, 改由后面重建时用 querySelector)
 el.appendChild(pinDiv(ix++));
 el.appendChild(Object.assign(document.createElement('div'),{className:'stitle',textContent:t('dashboard_quick_access')}));
 const q=document.createElement('div');q.className='qgrid reveal swiper';attachCascade(q,ix++);
 // ★ i18n: 第 2/3 项改为 strings.xml 的 key，渲染时经 t() 取当前语言（原为中文硬编码）
 const QDEF=[['cpu','dashboard_quick_cpu_title','dashboard_quick_cpu_desc','play','var(--purple)',1],
  ['gpu','dashboard_quick_gpu_title','dashboard_quick_gpu_desc','info','var(--purpleBright)',2],
  ['mem','dashboard_quick_mem_title','__MEM_DYNAMIC__','star','var(--purple)',3],
  ['net','dashboard_quick_net_title','dashboard_quick_net_desc','share','var(--purpleBright)',5],
  ['gps','dashboard_quick_gps_title','dashboard_quick_gps_desc','play','var(--magenta)',6],
  ['device','dashboard_quick_device_title','dashboard_quick_device_desc','search','var(--success)',8],
  ['battery','dashboard_quick_battery_title','dashboard_quick_battery_desc','battery','var(--purple)',4],
  ['sensor','dashboard_quick_sensor_title','dashboard_quick_sensor_desc','sensors','var(--purpleBright)',7]];
 QDEF[2][2]=fmtBytes(SIM.mem.usedKB)+' / '+fmtBytes(SIM.mem.totalKB);
 const qOrder=loadOrder('camp_qorder',QDEF.map(function(d){return d[0];}));
 q.innerHTML=qOrder.map(function(k){var u=QDEF.find(function(dd){return dd[0]===k;});
  // ★ i18n: 标题经 t() 翻译；副标题若为 __MEM_DYNAMIC__ 占位（被动态内存数据覆盖）则原样输出
  var _sub=(u[2]==='__MEM_DYNAMIC__')?u[2]:t(u[2]);
  return '<div class="qcard" data-qkey="'+k+'" draggable="true" onclick="navigate('+u[5]+')">'+
   '<span class="draghandle">'+svgIco('drag')+'</span>'+
   '<div class="qi" style="color:'+u[4]+'">'+svgIco(u[3])+'</div>'+
   '<div><b>'+t(u[1])+'</b><span>'+_sub+'</span></div></div>';}).join('');
 el.appendChild(q);
 bindDashDnD(el,'qcard','data-qkey',qOrder,function(){rerenderDash();},'camp_qorder');
 scheduleDashCharts();
};
function mgrid(title,val,colorVar,extra){
 let h='<div class="card mcard"'+((extra&&extra.batt)?' data-battborder="1"':'')+'><div class="lab">'+title+'</div><div class="val" style="color:var('+colorVar+')" data-tk-live="1">'+val+'</div>';
 if(extra&&extra.chart)h+='<canvas class="chartC" data-chart="'+extra.chart+'"></canvas>';
 if(extra&&extra.prog)h+='<div class="prog"><i style="width:'+(extra.prog()*100).toFixed(1)+'%;background:var('+colorVar+')"></i></div>';
 if(extra&&extra.sub)h+='<div class="subs">'+extra.sub+'</div>';
 if(extra&&extra.bottom){h+='<div class="minidiv"></div><div class="sublab">'+extra.bottom.label+'</div>'+
  '<div class="val" style="color:var(--success);font-size:16px;font-weight:600" data-tk-live="1"><span id="'+extra.bottom.id+'" data-live-tk="battTemp"></span></div>';}
 return h+'</div>';}
function scheduleDashCharts(){requestAnimationFrame(()=>{
 _tokStale&&refreshTok();
 $$('#page-dashboard [data-chart]').forEach(cv=>{
  const[key,col]=cv.dataset.chart.split(':');
  drawLineChart(cv,HIST[key],TOK[col]);});});}

/* — CPU — */
BUILDERS.cpu=function(el){
 let ix=0;
 el.appendChild(infoCard(ix++,SIM.cpu.arch,'8 cores · ARMv8','play','var(--purple)'));
 const st=document.createElement('div');st.className='msecT reveal swiper';attachCascade(st,ix++);
 st.textContent=t('cpu_temp_status_format',t('cpu_temp_status_normal'));el.appendChild(st);
 el.appendChild(metric(ix++,{title:t('cpu_temperature_title'),value:SIM.cpu.temp.toFixed(1)+'°C',
  colorVar:'--pRedD',subtitle:SIM.cpu.tempSource,chartId:'cpu_t_c',liveKey:'cpuTemp',format:'cpuTemp'}));
 const t1=document.createElement('div');t1.className='stitle reveal swiper';attachCascade(t1,ix++);
 t1.textContent=t('cpu_c_states_deep_sleep');el.appendChild(t1);
 el.appendChild(metric(ix++,{title:'C-States',value:Math.round(SIM.cpu.deepSleep)+'%',colorVar:'--purpleBright',
  subtitle:SIM.cpu.cpuidleSrc,chartId:'cpu_s_c'}));
 const totUs=SIM.cpu.cStates.reduce((a,s)=>a+s.timeUs,0);
 SIM.cpu.cStates.forEach(cs=>{const pct=cs.timeUs/totUs*100;
  const cvr=cs.lvl>=2?'--purpleBright':cs.lvl===1?'--cyan':null;
  const col=cs.lvl>=2?'var(--purpleBright)':cs.lvl===1?'var(--cyan)':'color-mix(in srgb,var(--purple) 60%,transparent)';
  el.appendChild(metric(ix++,{title:cs.name+' (C'+cs.lvl+') · '+(cs.lvl===1?t('_sim_cstate_wfi'):cs.lvl===2?t('_sim_cstate_light'):t('_sim_cstate_deep')),
   value:pct.toFixed(0)+'%',colorRaw:col,prog:pct/100,
   subtitle:t('_sim_cstate_sub',cs.latency,cs.usage)}));});
 el.appendChild(metric(ix++,{title:'L1 Cache',value:SIM.cpu.cacheL1,colorVar:'--purpleBright'}));
 el.appendChild(metric(ix++,{title:'L2 Cache',value:SIM.cpu.cacheL2,colorVar:'--purpleBright'}));
 el.appendChild(metric(ix++,{title:'L3 Cache',value:'4032 KB',colorVar:'--purpleBright'}));
 const t2=document.createElement('div');t2.className='stitle reveal swiper';attachCascade(t2,ix++);
 t2.textContent=t('cpu_supported_abis');el.appendChild(t2);
 SIM.cpu.abis.forEach((abi,i)=>{el.appendChild(metric(ix++,{title:i?t('cpu_compatible_abi'):t('cpu_primary_abi'),
  value:i?'ARM 32-bit (armeabi-v7a)':'ARM 64-bit (arm64-v8a)',colorVar:'--purpleBright',subtitle:abi}));});
 const t3=document.createElement('div');t3.className='stitle reveal swiper';attachCascade(t3,ix++);
 t3.textContent=t('cpu_core_frequency');el.appendChild(t3);
 SIM.cpu.freq.forEach(c=>{el.appendChild(metric(ix++,{title:'Core '+c.idx,
  value:c.cur+' MHz',colorVar:'--purpleBright',liveSub:c,progDyn:c}));});
 const chRow=document.createElement('div');chRow.className='reveal swiper';attachCascade(chRow,ix++);
 chRow.style.cssText='display:flex;justify-content:center;margin:4px 0 14px;';
 chRow.innerHTML='<button class="chip on" id="chipClu">'+t('cpu_per_cluster')+'</button><button class="chip" id="chipCor" style="margin-left:10px">'+t('cpu_per_core')+'</button>';
 el.appendChild(chRow);
 const cont=document.createElement('div');cont.id='cpuClusterView';el.appendChild(cont);
 chRow.querySelector('#chipClu').onclick=()=>swCpuView(0);
 chRow.querySelector('#chipCor').onclick=()=>swCpuView(1);
 renderClusters(cont);
 window.__redrawCpu=function(){
  $$('#page-cpu [data-chartline]').forEach(cv=>{drawLineChart(cv,HIST[cv.dataset.k],TOK[cv.dataset.c]);});
 };
 setTimeout(function(){_tokStale&&refreshTok();
  var a=$('#cpu_t_c'),b=$('#cpu_s_c');
  a&&drawLineChart(a,HIST.cpuTemp,TOK.pRed);
  b&&drawLineChart(b,HIST.cpuSleep,TOK.purpleBright);},40);
};
function swCpuView(m){cpuMode=m;
 $('#chipClu')&&$('#chipClu').classList.toggle('on',m===0);
 $('#chipCor')&&$('#chipCor').classList.toggle('on',m===1);
 renderClusters($('#cpuClusterView'));}
function renderClusters(host){
 if(!host)return;
 const groups={};
 SIM.cpu.freq.forEach(c=>{(groups[c.cluster]=groups[c.cluster]||[]).push(c);});
 host.innerHTML='';
 let k=100;
 Object.keys(groups).forEach(name=>{
  const group=groups[name],first=group[0];
  if(cpuMode===0){
   const card=document.createElement('div');card.className='card reveal swiper';card.dataset.casc=k++;
   card.style.padding='16px';
   card.innerHTML='<div style="display:flex;align-items:center">'+
    '<div style="flex:1"><div style="font-size:18px;font-weight:700;color:var(--txtP)">'+name+'</div>'+
    '<div style="font-size:13.5px;color:var(--txtS);margin-top:2px">'+t('_sim_cores_max',group.length,first.max)+'</div></div>'+
    '<div id="clv_'+name+'" style="font-size:18px;font-weight:700;color:var(--pBlueD)">'+group.map(g=>g.cur).join('/')+' MHz</div></div>'+
    '<canvas class="chartC" data-chartline data-k="cpuFreq" data-c="pBlue" style="margin-top:12px"></canvas>';
   host.appendChild(card);}
  else{
   const card=document.createElement('div');card.className='card reveal swiper';card.dataset.casc=k++;
   card.style.padding='16px';
   let cells='';
   group.forEach(core=>{cells+='<div style="background:color-mix(in srgb,var(--muted) 50%,transparent);border-radius:8px;padding:11px 13px;flex:1 1 calc(25% - 12px);min-width:118px">'+
    '<div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:14px">Core '+core.idx+'</b>'+
    '<span style="font-size:11px;color:var(--pGreenD)">'+core.usage+'%</span></div>'+
    '<div style="font-size:14px;font-weight:700;color:var(--purpleBright);margin-top:3px" data-core-freq="'+core.idx+'">'+core.cur+' MHz</div>'+
    '<div style="font-size:10.5px;color:var(--txtS);opacity:.65;margin-top:2px">max '+core.max+' MHz · '+core.gov+'</div></div>';});
   card.innerHTML='<div style="font-size:15px;font-weight:600;color:var(--txtP);margin-bottom:9px">'+
    t('_sim_cluster_cores',name,group.length)+'</div>'+
    '<div style="display:flex;flex-wrap:wrap;gap:9px">'+cells+'</div>';
   host.appendChild(card);}});
 requestAnimationFrame(()=>window.__redrawCpu&&__redrawCpu());}

/* — GPU — */
BUILDERS.gpu=function(el){
 let ix=0;const G=SIM.gpu;
 el.appendChild(infoCard(ix++,G.model,[G.freq+' MHz','/ '+G.max+' MHz',G.gov].filter(Boolean).join(' · '),
  'info',G.throttled?'var(--warning)':'var(--purple)'));
 if(G.throttled){const w=document.createElement('div');w.className='reveal swiper';w.style.cssText='font-size:13px;font-weight:500;color:var(--warning);margin:-6px 0 10px;';
  w.textContent=t('gpu_dvfs_throttling_warning');attachCascade(w,ix++);el.appendChild(w);}
 const lc=document.createElement('div');lc.className='card mcard reveal swiper';attachCascade(lc,ix++);
 lc.innerHTML='<div class="lab">GPU load</div><div class="val" id="gv_load" style="color:var(--pVioletD)">44%</div>'+
  '<div style="display:flex;justify-content:space-between;font-size:12px;margin-top:3px"><span style="color:var(--txtS)">'+t('gpu_effective_utilization')+'</span><span style="color:var(--success)" id="gv_eff">'+Math.round(G.effectiveUtil)+'%</span></div>'+

  '<div class="subs">'+(G.throttled?t('gpu_max_freq_format',G.max+' MHz',t('gpu_throttled')):'Max: '+G.max+' MHz')+'</div><canvas class="chartC" id="gpu_f_c"></canvas>';

 const parts=G.vulkanDrv.split('.');

 el.appendChild(metric(ix++,{title:'Vulkan Driver Version',value:disp,colorVar:'--success',subtitle:t('gpu_integrated')}));
 setTimeout(()=>{_tokStale&&refreshTok();
  const a=$('#gpu_l_c'),b=$('#gpu_f_c'),cc=$('#gpu_t_c');
  a&&drawLineChart(a,HIST.gpuLoad,TOK.pViolet);
  b&&drawLineChart(b,HIST.gpuFreq,TOK.pBlue);
  cc&&drawLineChart(cc,HIST.gpuTemp,TOK.pRed);
 },30);

/* — Memory — */
BUILDERS.memory=function(el){
 let ix=0,M=SIM.mem;
 el.appendChild(metric(ix++,{title:t('memory_title'),value:fmtBytes(M.totalKB-M.usedKB)+' '+t('memory_available'),colorVar:'--purpleBright',
  subtitle:t('_sim_mem_used_of',fmtBytes(M.usedKB),fmtBytes(M.totalKB)),prog:M.usedKB/M.totalKB}));
 el.appendChild(metric(ix++,{title:t('memory_swap_zram_title'),value:fmtBytes(M.swapUsedKB)+' '+t('_sim_swap_in_use'),colorVar:'--purpleBright',
  subtitle:t('memory_swap_total',fmtBytes(M.swapTotalKB)),prog:M.swapUsedKB/M.swapTotalKB}));
 el.appendChild(metric(ix++,{title:t('memory_zram_used_title'),value:fmtBytes(M.zramKB),colorVar:'--purpleBright',chartId:'mem_z_c'}));
 const cats=[[t('memory_category_app'),M.appKB,'#C084FC'],[t('memory_category_cached'),M.cachedKB,'#818CF8'],[t('memory_category_system'),M.sysKB,'#00D4FF'],
  [t('memory_category_free'),M.freeKB,'#34C759'],[t('memory_category_other'),M.otherKB,'#94A3B8']];
 let bar='',leg='';
 cats.forEach(([n,kb,c])=>{bar+='<div style="width:'+(kb/M.totalKB*100).toFixed(2)+'%;background:'+c+'"></div>';
  leg+='<div style="display:flex;align-items:center;padding:3px 0"><div style="width:8px;height:8px;border-radius:50%;background:'+c+'"></div>'+
   '<span style="width:40px;margin-left:8px;font-size:13px;color:var(--txtP)">'+n+'</span>'+
   '<span style="flex:1;margin-left:8px;font-family:ui-monospace,monospace;font-size:12px;color:var(--txtS)">'+fmtBytes(kb)+'</span>'+
   '<span style="font-family:monospace;font-size:12px;color:var(--txtS)">'+(kb/M.totalKB*100).toFixed(1)+'%</span></div>';});
 const md=makeCard('mcard reveal','<div class="lab">'+t('memory_distribution_title')+'</div>'+
  '<div class="val" style="color:var(--purpleBright);font-family:ui-monospace,monospace;letter-spacing:.5px">'+
  fmtBytes(M.totalKB-M.freeKB)+' / '+fmtBytes(M.totalKB)+'</div>'+
  '<div style="display:flex;height:16px;border-radius:8px;overflow:hidden;margin-top:12px">'+bar+'</div>'+
  '<div style="margin-top:13px">'+leg+'</div>');
 attachCascade(md,ix++);el.appendChild(md);
 el.appendChild(metric(ix++,{title:t('memory_available_title'),value:fmtBytes(M.totalKB-M.usedKB),colorVar:'--purpleBright',chartId:'mem_a_c'}));
 el.appendChild(metric(ix++,{title:t('memory_used_title'),value:fmtBytes(M.usedKB),colorVar:'--purpleBright',chartId:'mem_u_c'}));
 const tp=document.createElement('div');tp.className='card mcard reveal swiper';attachCascade(tp,ix++);
 tp.innerHTML='<div class="lab">'+t('memory_top_processes_title')+'</div><div class="val" style="font-size:13.5px;line-height:1.85;letter-spacing:0;color:var(--purpleBright);font-family:ui-monospace,monospace">'+
  M.top.join('<br>')+'</div>';el.appendChild(tp);
 setTimeout(()=>{_tokStale&&refreshTok();
  [['#mem_z_c'],['#mem_a_c'],['#mem_u_c']].forEach(([sel])=>{const cv=$(sel);cv&&drawLineChart(cv,HIST.ram,TOK.purple);});
 },30);
};

<script>
"use strict";
/* — Battery (BatteryScreen.kt 卡片顺序) — */
BUILDERS.battery=function(el){
 let ix=0;const B=SIM.bat;
 var psText=({'ps_ac':t('ps_ac'),'ps_usb':t('ps_usb'),'ps_wireless':t('ps_wireless'),'ps_external':t('ps_external'),'ps_battery':t('ps_battery')})[B.psLabel]||B.psLabel;
 el.appendChild(infoCard(ix++,((B.plugged&&B.charging)?t('battery_status_charging'):(B.plugged?t('_sim_batt_connected_idle'):t('battery_status_discharging')))+' · '+Math.round(B.level)+'%',
  B.tech+'  |  '+psText,'favorite','var(--purple)'));
 // 1. 电流校准倍率卡
 const mc=document.createElement('div');mc.className='card reveal swiper';attachCascade(mc,ix++);
 mc.innerHTML='<div style="display:flex;justify-content:space-between;align-items:flex-start">'+
  '<div style="padding-right:12px;flex:1"><div style="font-size:15px;font-weight:700;color:var(--txtP)">'+t('battery_current_multiplier_title')+'</div>'+
  '<div class="subs">'+t('_sim_oem_cal')+'</div></div>'+
  '<div style="display:flex;align-items:center;gap:10px"><span id="mulV">×'+B.multiplier.toFixed(1)+'</span><span id="mulSw"></span></div></div>'+
  '<div id="mulSlider"></div><div id="mulPresets" style="display:flex;margin-top:4px;gap:2px"></div>';
 el.appendChild(mc);
 // power_save（省电模式卡 — 仅省电时显示，对齐源码 BATTERY_CARD_IDS / power_save）
 if(B.powerSave){
  el.appendChild(metric(ix++,{title:t('_sim_powersave'),value:'🔋 ON',colorRaw:'#FFA726',
   subtitle:t('_sim_powersave_sub')}));
 }
 // 静态卡组（与 BatteryScreen 卡序一致）
 const sohRaw=B.healthPct>=90?'var(--purpleBright)':B.healthPct>=75?'#FFA726':'#EF5350';
 el.appendChild(metric(ix++,{title:t('battery_health_status_title'),value:B.healthPct+'%',colorRaw:sohRaw,
  subtitle:B.nowCap+' / '+B.designCap+' mAh · '+t('_sim_capacity_ratio')}));
 el.appendChild(metric(ix++,{title:t('battery_design_capacity_title'),value:B.designCap+' mAh',colorVar:'--purpleBright',subtitle:'charge_full_design'}));
 el.appendChild(metric(ix++,{title:t('battery_rated_capacity_title'),value:B.nowCap+' mAh',colorVar:'--purpleBright',subtitle:t('_sim_est_by_cap',B.estLevel)+'  ·  '+B.capSrc}));
 const est=B.cycle===0?100:B.cycle<=200?clamp(100-B.cycle/10,85,100):B.cycle<=500?clamp(100-B.cycle/20,75,90):clamp(80-(B.cycle-500)/25,60,80);
 el.appendChild(metric(ix++,{title:t('battery_cycle_count_title'),value:t('battery_cycle_count_value',B.cycle),colorVar:'--purpleBright',subtitle:t('_sim_est_health',Math.round(est))+'  |  '+B.cycleSrc}));
 el.appendChild(metric(ix++,{title:t('battery_charging_protocol_title'),value:B.protocol,colorVar:'--success'}));
 el.appendChild(metric(ix++,{title:t('battery_card_power_source'),value:psText,colorRaw:(B.psLabel==='ps_ac'?'var(--success)':(B.psLabel==='ps_usb'||B.psLabel==='ps_wireless')?'var(--purpleBright)':'#FFA726')}));
 el.appendChild(metric(ix++,{title:t('battery_card_real_wattage'),value:B.watt.toFixed(2)+' W',
  colorVar:B.charging?'--success':'--purpleBright'}));
 el.appendChild(metric(ix++,{title:t('battery_internal_resistance_title'),value:B.inR.toFixed(0)+' mΩ',colorVar:'--purpleBright',
  subtitle:B.inR<100?t('battery_resistance_excellent'):B.inR<200?t('battery_resistance_good'):t('battery_resistance_average')}));
 el.appendChild(metric(ix++,{title:t('battery_level_title'),value:Math.round(B.level)+'%',colorVar:'--purpleBright',
  chartId:'bat_l_c'}));
 el.appendChild(metric(ix++,{title:B.charging?t('battery_charging_power_title'):t('battery_discharge_power_title'),value:(Math.abs(B.cur*B.volt/1e9)).toFixed(2)+' W',

/** 取译文：t('key') / t('key', arg1, arg2)
 *  占位符：%1$d 整数、%1$s 字符串、%1$.2f 小数（[\.\d]* 兼容精度写法）
 *  缺失 key 时原样返回 key（便于排查未翻译处） */
function t(k){
 var e=I18N[k];
 if(!e)return k;
 var i=LANG_IDX[CFG&&CFG.lang];
 if(i===undefined)i=1;
 var s=(e[i]!==undefined&&e[i]!=='')?e[i]:(e[1]||e[0]||k);
 for(var a=1;a<arguments.length;a++){
  s=s.replace(new RegExp('%'+a+'\\$[\\.\\d]*[sdf]','g'),arguments[a]);
 }
 return s;
}

/** 应用当前语言：全站重建（tab 栏 + 所有已渲染页面 + 已打开的覆盖层）
 *  ⚠️ 重建页面时保留用户所在页；入场动画不重放（ENTRANCE_DONE 已为 true）。 */
function applyLanguage(){
 try{
  try{localStorage.setItem('camp_lang',CFG.lang);}catch(_){}
  try{buildTabs();}catch(e){pushDebug('lang buildTabs: '+((e&&e.message)||e));}
  // 记录并重建已渲染页面
  // ★ BUGFIX: 原用 Array.prototype.slice.call(RENDERED) —— 对 Set 无效（Set 不是 array-like，
  //   没有 length/索引，slice.call 恒返回 []）→ 循环一次都不执行 → 页面从未重建 → 用户切到
  //   English 后除了 tab 栏（buildTabs 单独重建）其他页面纹丝不动。改用 Array.from。
  var wasRendered=[];
  try{wasRendered=Array.from(RENDERED);}catch(_){}
  try{RENDERED.clear();}catch(_){}
  var track=$('#track');
  if(track){
   var pgs=track.children;
   for(var n=0;n<wasRendered.length;n++){
    var i=wasRendered[n],pg=pgs[i];
    if(!pg)continue;
    try{
     pg.innerHTML='';
     var b=BUILDERS[TABS[i][0]];
     if(b)b(pg);
     RENDERED.add(i);              // ★ 重建成功后回填缓存，否则后续 ensurePageRendered 会重复渲染
    }catch(e){pushDebug('lang render '+i+': '+((e&&e.message)||e));}
   }
  }
  try{applyPagerTransforms(true);onPageSettled();}catch(_){}
  // 已打开的覆盖层同步重建
  try{var ovSet=$('#ovSet');if(ovSet&&ovSet.classList.contains('show'))buildSettings();}catch(_){}
  try{
   var ovSen=$('#ovSen');
   if(ovSen&&ovSen.classList.contains('show')&&typeof senCur!=='undefined'&&senCur>=0)openSensorOverlay(senCur,0,0,null);
  }catch(_){}
  try{onDataTick();}catch(_){}
  // ★ F-30 修复：firstLaunch 不在 RENDERED 里（init() 阶段创建），applyLanguage 不重建它
  //   → 切语言后 firstLaunch 仍是中文（"开启监控所需权限 / 同意并授权 / 稍后再说"），
  //   而且 z-index 50 + inset:0 仍挡住 dashboard 视野。删除并按当前语言重建。
  //   尊重 localStorage 标记：用户已点过"授予"的不重建（避免每次切语言都重新弹）。
  try{
   var fl=$('#firstLaunch');
   if(fl){
    fl.remove();
    if(typeof buildFirstLaunch==='function'&&!localStorage.getItem('camp_first')){
     try{buildFirstLaunch();}catch(_){}
    }
   }
  }catch(_){}
 }catch(e){pushDebug('applyLanguage: '+((e&&e.message)||e));}
}

 cards+='<div class="setgrp surf"><div style="font-size:15px;font-weight:600;color:var(--txtP)">'+t('sensor_info_title')+'</div>'+

  infoRow(t('sensor_info_type_id'),s.type+'  ('+(s.oneShot?t('sensor_reporting_one_shot'):s.minDelay==='on-change'?t('sensor_reporting_on_change'):t('sensor_reporting_continuous'))+')')+
  infoRow(t('sensor_info_vendor'),s.vendor)+infoRow(t('sensor_info_resolution'),s.res)+infoRow(t('sensor_info_power'),s.power)+
  infoRow(t('sensor_info_max_range'),(s.fmt?s.maxRange.toFixed(s.fmt>4?6:2):s.maxRange)+(s.unit?' '+senUnit(s):''))+
  infoRow(t('sensor_info_min_delay'),s.minDelay)+infoRow(t('sensor_info_is_dynamic'),s.dyn?t('common_yes'):t('common_no'))+infoRow(t('sensor_info_is_wakeup'),s.wake?t('common_yes'):t('common_no'))+'</div>';
 c.innerHTML=title+'<div style="display:flex;flex-direction:column;gap:12px">'+cards+'</div>';

 // F5-2 FLIP 标题形变（简版 sharedElement）：从来源卡片位置飞入详情标题

  // BUGFIX: 覆盖层展开后再用 elementFromPoint 取到的会是覆盖层自身(它已盖在最上层)，
  // 导致 .seccard 命中 null、标题飞入动画被静默跳过。优先用点击处直接传入的源卡片。
  var srcCard=(srcEl&&srcEl.closest)?srcEl.closest('.seccard'):(function(){

   tt.style.transform='translate('+dx.toFixed(1)+'px,'+dy.toFixed(1)+'px)';tt.style.opacity='0';
   // BUGFIX: 原用嵌套 requestAnimationFrame 触发终态；rAF 与 paint 周期绑定、在部分环境不调度，
   // 会导致标题永久停在 translate(...) + opacity:0（完全不可见）—— 即"传感器详情页有 bug"。
   // 改标准 FLIP：强制 reflow 提交初态后设终态，transition 由 CSS 引擎推进，不依赖 rAF。

function openCardOverlay(ov){
 // ★ BUGFIX (F-19) 配套：撤销上一次 closeCardOverlay 遗留的 620ms 关闭回调，
 //   否则它会在覆盖层重新打开后把 show 摘掉 + clipPath 重置回 circle(0%)（"闪一下就没"）。
 if(ov._closeT){clearTimeout(ov._closeT);ov._closeT=null;}
 // BUGFIX: #ovSen 初始带 inline clip-path:circle(0%)，而 cardmode 走 transform/opacity 机制、
 // 不会解除该裁剪 —— 不清除会导致覆盖层展开后内容仍被裁成零半径圆而完全不可见。
 // ★ 必须先清 transition：若残留 clip-path 过渡（revealClose 遗下的 .4s），把 clipPath 设为
 //   'none' 会被浏览器插值成中间态 → 覆盖层"只展开一半"就停住。
 ov.style.transition='';
 ov.style.clipPath='none';
 // BUGFIX: 嵌套 rAF 与 setTimeout(16) 在 Edge headless 下均不被调度 → .open 永不加上 →
  // cardbg opacity 0 + ovl-inner scale(.3) opacity(0) → 覆盖层完全透明但罩着整张 page 拦截点击。
  // 妥协：同步加 .open（放弃展开动画换可见性与可点击性）。
 ov.classList.add('show','cardmode');
 if(!ov.querySelector('.cardbg')){var bg=document.createElement('div');bg.className='cardbg';
  ov.insertBefore(bg,ov.firstChild);}
 // ★ 恢复平滑展开动画：先加初始态(scale .3/opacity 0)，强制 reflow 提交它，
 //   推迟到下一帧(setTimeout 16≈一帧)再加 .open 触发 CSS transition。
 //   同步 add .open 会被浏览器合并为同一次 style recalc → 直接跳终态 → 没有展开动画。
 // ★ 终极可靠：inline style 强制覆盖 CSS 类(class specificity 10, inline 1000)
 //   → 任何环境都立即 transform:none + opacity:1 / .92，覆盖层瞬时完全展开。
 //   用 getElementById 直取 #ovSenIn，加 __ocDone 标记供 dbg 验证。
 window.__ocDone=true;
 ov.classList.add('show','cardmode','open');   // ★ 终态由 CSS 保证（fail-visible 第一道防线）
 // ★ BUGFIX (F-28): 原同步设 inline 终态(transform:none/opacity:1) —— 与 .open 的 style 变更
 //   被浏览器合并成同一次 style recalc，CSS transition 从初始值直接跳到终值 → **展开动画被跳过**
 //   （用户报"缩放位移动画没有做好"）。改为：清掉 inline 让 CSS 终态生效，动画交给 WAAPI
 //   （由浏览器动画引擎推进，不依赖 style recalc 时机 / rAF；fill:'none' → 结束后自动回落
 //   CSS 终态，不会像 inline 那样永久残留）。
 var inner=document.getElementById('ovSenIn');
 if(inner){
  inner.style.transform='';inner.style.opacity='';inner.style.transition='';
  try{
   if(inner.animate)inner.animate([
    {transform:'scale(.3) translateY(24px)',opacity:0},
    {transform:'none',opacity:1}
   ],{duration:420,easing:'cubic-bezier(.4,0,.2,1)',fill:'none'});
  }catch(_){}
 }
 var bg=ov.querySelector('.cardbg');
 if(bg){
  bg.style.opacity='';
  // ★ F-28 修复 (reviewer 阻断): 终帧硬编码 .94 与玻璃模式 CSS 终态 .22 冲突，会在
  //   480ms 内把毛玻璃压死 + 闪跳。改为读 CSS 实际目标值，结束 fill:'none' 时无缝回落。
  var targetOp=parseFloat(getComputedStyle(bg).opacity)||.94;
  try{
   if(bg.animate)bg.animate([{opacity:0},{opacity:targetOp}],
    {duration:480,easing:'cubic-bezier(.4,0,.2,1)',fill:'none'});
  }catch(_){}
 }
 // 兜底（第二道防线）：动画若因环境未推进，700ms 后清一切 inline，确保回落到 CSS 终态
 if(ov._animT)clearTimeout(ov._animT);
 ov._animT=setTimeout(function(){ov._animT=null;
  try{var i2=document.getElementById('ovSenIn');
   if(i2){i2.style.transform='';i2.style.opacity='';i2.style.transition='';}
   var b2=ov.querySelector('.cardbg');if(b2)b2.style.opacity='';}catch(_){}
 },700);
 void ov.offsetWidth;
}
function closeCardOverlay(ov,cb){
 ov.classList.remove('open');
 // ★ BUGFIX (F-19): 原来这个 timer 无句柄、全文件无处 clearTimeout。关闭后 620ms 内
 //   用户再点卡片时，openCardOverlay 已加回 show/cardmode/open 并把 clipPath 置 'none'，
 //   而这个滞留回调会在 +620ms 摘掉 show(→display:none) 并把 clipPath 重置回 circle(0%)，
 //   表现为「点了没打开 / 闪一下就没了」。真实用户「返回后立刻点下一张」必然命中；
 //   headless 只测首次打开，永远测不到。现在把句柄存到元素上，打开时先撤销。
 if(ov._closeT){clearTimeout(ov._closeT);ov._closeT=null;}
 ov._closeT=setTimeout(function(){ov._closeT=null;
  ov.classList.remove('show','cardmode');
  ov.style.clipPath='circle(0% at 50% 42%)';if(cb)cb();},620);}

   case t('gps_satellite_count_title'):{var cnt=G.satellites.filter(function(s){return s.usedInFix}).length;
    val.textContent=cnt+' / '+G.satellites.length;break;}
   default:break;}});
 Array.prototype.forEach.call(document.querySelectorAll('#page-gps [data-sat-snr]'),function(el){
  var i=+el.getAttribute('data-sat-snr'),sd=SIM.gps.satellites[i];
  if(!sd)return;
  el.textContent='SNR: '+sd.snr.toFixed(1);
  var azEl=document.querySelector('[data-sat-az="'+i+'"]'),
      ee=document.querySelector('[data-sat-el="'+i+'"]');
  azEl&&(azEl.textContent=t('_sim_gps_az',sd.azimuth.toFixed(0)));
  ee&&(ee.textContent=t('_sim_gps_el',sd.elevation.toFixed(0)));});
 var cv=$('#skyC');cv&&drawSkyPlot(cv,SIM.gps.satellites);
 renderSkyLegend($('#skyLg'));}
function deviceLiveUpdate(){
 var t=$('#dv_todaySteps');t&&(t.textContent=SIM.dev.todaySteps);
 var tt=$('#dv_totalSteps');tt&&(tt.textContent=SIM.dev.totalSteps);
 var b=$('#dv_bootSteps');b&&(b.textContent=SIM.dev.sinceBoot);}
function floatStackTick(){
 if(!FW.enabled)return;
 $$('.fstack .fw').forEach(function(el){updateFwText(el,el.dataset.k);});}
function wifiChipStr(){return SIM.net.chipT.toFixed(1)+'°C · '+t('_sim_off');}

var LIVE_HANDLERS=[dashUpdate,cpuLiveUpdate,gpuLiveUpdate,memoryLiveUpdate,batteryLiveUpdate,
 networkLiveUpdate,gpsLiveUpdate,deviceLiveUpdate,floatStackTick];
function onDataTick(){
 LIVE_HANDLERS.forEach(function(f){try{f();}catch(e){/*静默降级*/}});}

/* ══════════ 初始化 ══════════ */
// ★ i18n: 第 2 项改为 strings.xml 的 key（原为中文硬编码），显示时经 t() 取当前语言
const TABS=[['dashboard','tab_dashboard','dashboard'],['cpu','tab_cpu','cpu'],['gpu','tab_gpu','gpu'],
 ['memory','tab_memory','memory'],['battery','tab_battery','battery'],['network','tab_network','network'],
 ['gps','tab_gps','gps'],['sensors','tab_sensors','sensors'],['device','tab_device','device']];
window.navigate=navigate;window.openSensorOverlay=openSensorOverlay;window.openHdrLab=openHdrLab;
window.openLangPicker=openLangPicker;

function buildTabs(){
 var row=$('#tabrow');
 row.innerHTML=TABS.map(function(tb,i){
  return '<div class="tab'+(i===0?' on':'')+'" data-i="'+i+'">'+
   '<span class="tico">'+svgIco(tb[2])+'</span><span class="tname">'+t(tb[1])+'</span></div>';}).join('');
 row.querySelectorAll('.tab').forEach(function(tb){
  tb.addEventListener('click',function(e){navigate(+tb.dataset.i,e);});});
}

function init(){
 refreshTok();buildTabs();
 // pager pages
 var track=$('#track');
 TABS.forEach(function(t){var d=document.createElement('div');d.className='page';d.id='page-'+t[0];
  track.appendChild(d);});
 // ① fail-visible：首屏页面渲染先于一切可失败组件（对齐 MainActivity 组合语义）
 try{ensurePageRendered(0);}catch(e){pushDebug('dashboard: '+((e&&e.message)||e));}
 // ② 可失败组件逐个 try/catch 隔离 —— 任何一个坏不阻断其余
 safeWrap('glassWin',function(){
  var g=new GlassBtn($('#slotWin'),36,'window',17,function(){return TOK.txtS;});
  APP.glassBtns.push(g);
  g.onClick=function(){buildFloatConfig();revealOpen($('#ovFlt'),eventPositionX(),30);};});
 safeWrap('glassSet',function(){
  var g=new GlassBtn($('#slotSet'),36,'settings',17,function(){return TOK.txtS;});
  APP.glassBtns.push(g);
  g.onClick=function(){buildSettings();revealOpen($('#ovSet'),innerWidth-24,30);};});
 safeWrap('backSet',function(){new BackBtn($('#slotSetBack'),48,function(){revealClose($('#ovSet'));});});
 safeWrap('backFlt',function(){new BackBtn($('#slotFltBack'),48,function(){revealClose($('#ovFlt'));});});
 safeWrap('backSen',function(){new BackBtn($('#slotSenBack'),48,function(){closeSenOverlay();});});
 // 点击覆盖层 acrylic 区域关闭 (backdrop 语义)
 [['ovSet'],['ovFlt'],['ovSen']].forEach(function(id){
  var ov=$(('#'+id[0]));
  ov.addEventListener('pointerdown',function(e){
   if(e.target===ov){
    id[0]==='ovSen'?closeSenOverlay():revealClose(ov);}});});
 $('#themeBtn').onclick=function(){
  document.body.dataset.theme=document.body.dataset.theme==='dark'?'light':'dark';
  this.textContent=document.body.dataset.theme==='dark'?'☀️':'🌙';
  _tokStale=true;refreshTok();
  repaintAllGlass();
  // 重绘当前页图表 (canvas token 已缓存色彩需重绘)
  setTimeout(onDataTick,60);};
 // Esc = 返回 (覆盖层 → 页面 → 回概览)
 document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){
   if($('#ovSen').classList.contains('show'))closeSenOverlay();
   else if($('#ovSet').classList.contains('show'))revealClose($('#ovSet'));
   else if($('#ovFlt').classList.contains('show'))revealClose($('#ovFlt'));
   else if(APP.target!==0)navigate(0);} });
 // 翻页手势已由 v6 引擎接管（initPagerGestures 于下方调用）
 safeWrap('pagerGestures',initPagerGestures);
 // 轮询心跳至 HUD
 setInterval(function(){/* live 数据 tickData 已有 interval */},1500);
 // fw stack 初始渲染
 // ★ BUGFIX (F-23): 原来裸调用，若抛异常会中断其后 2502-2510 的 resize 监听、
 //   120ms 补偿重算、以及 ENTRANCE_DONE 定时器 —— 后者不置位会让后续页面一直播入场动画。
 safeWrap('floatStack',function(){renderFloatStack();paintFwPreview();});
 // FirstLaunchPermissionScreen（MainActivity.kt:169-216 等价）
 try{if(!localStorage.getItem('camp_first')&&!new URLSearchParams(location.search).has('nf'))buildFirstLaunch();}catch(e){}
 window.addEventListener('resize',function(){
  _tokStale=true;refreshTok();
  applyPagerTransforms(true);
  repaintAllGlass();
  setTimeout(onDataTick,80);});
 // 进入页面时若 overflow 显示错位重算一次
 setTimeout(function(){applyPagerTransforms(true);onDataTick();},120);
 // 入场动画结束关闭 entrance 标记
 setTimeout(function(){ENTRANCE_DONE=true;},3200);
}
function buildFirstLaunch(){
 var d=document.createElement('div');d.id='firstLaunch';
 // ★ BUGFIX (F-24): 原 z-index:200 + 整体参与 hit-test，在 file:// 协议下 localStorage 受限
 //   / 用户未点关闭 / 隐身模式等场景下 #firstLaunch 一直挂着，全屏挡住所有点击 → 真实点击
 //   落到 firstLaunch 而不是下方传感器卡片 / HDR 入口，用户感觉"点了没反应"。
 //   现在：① 整层 pointer-events:none 让空白穿透（用户能正常用覆盖层/HDR/快速访问），
 //         ② 按钮单独 pointer-events:auto 仍可点； ③ z-index 50 留作视觉层级（覆盖层 80 仍可盖住）
 //         ④ 30s 超时自毁兜底，防止用户不点按钮永远被挡。
 d.style.cssText='position:absolute;inset:0;z-index:50;pointer-events:none;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;';
 d.innerHTML='<div style="font-size:22px;font-weight:700;color:var(--purpleBright);pointer-events:none">'+t('first_launch_title')+'</div>'+
  '<div style="font-size:14px;color:var(--txtS);margin:16px 0 30px;line-height:1.9;pointer-events:none">'+t('_sim_fl_body')+'<br>'+t('_sim_fl_p1')+'<br>'+t('_sim_fl_p2')+'<br>'+t('_sim_fl_p3')+'<br><span style="opacity:.55;font-size:12px">'+t('_sim_fl_note')+'</span></div>'+
  '<button id="flGrant" style="min-width:210px;padding:12px;border:none;border-radius:24px;background:var(--purple);color:var(--onP);font-size:15px;cursor:pointer;pointer-events:auto">'+t('first_launch_grant')+'</button>'+
  '<button id="flLater" style="margin-top:14px;background:none;border:none;color:var(--txtS);font-size:14px;cursor:pointer;pointer-events:auto">'+t('first_launch_later')+'</button>';
 // 30 秒超时自毁 —— 用户即使不点按钮也不至于永远被挡
 d._flAutoT=setTimeout(function(){if(d.parentNode)d.remove();},30000);
 $('#app').appendChild(d);
 var done=function(){try{localStorage.setItem('camp_first','1');}catch(_){}
  if(d._flAutoT){clearTimeout(d._flAutoT);d._flAutoT=null;}
  d.style.transition='opacity .4s';d.style.opacity='0';
  if(d._flT)clearTimeout(d._flT);
  d._flT=setTimeout(function(){if(d.parentNode)d.remove();},430);};
 d.querySelector('#flGrant').onclick=function(){try{navigator.vibrate&&navigator.vibrate(10);}catch(_){}done();};
 d.querySelector('#flLater').onclick=done;}
function eventPositionX(){return innerWidth-Math.min(innerWidth*.15,90);}
function loadOrder(lsKey,def){try{var v=JSON.parse(localStorage.getItem(lsKey)||'null');
  if(Array.isArray(v)&&v.length===def.length&&v.every(function(k){return def.indexOf(k)>=0;}))return v;}catch(e){}
 return def.slice();}
function saveOrder(lsKey,arr){try{localStorage.setItem(lsKey,JSON.stringify(arr));}catch(e){}}
function bindDashDnD(rootEl,sel,attr,orderArr,rerender,lsKey){
 if(rootEl.dataset.dndBound)return;rootEl.dataset.dndBound='1';
 var dragKey=null;
 rootEl.addEventListener('dragstart',function(e){
  // ★ BUGFIX (F-26): .qcard 带原生 draggable="true"，在快速访问网格上水平滑动会先触发
  //   浏览器原生 HTML5 拖拽并取消后续 pointermove → 自定义 HorizontalPager 翻页手势失效
  //   （在 .qgrid 区域完全滑不动页）。这里按位移方向让位：水平位移 > 垂直位移时判定为
  //   翻页手势，阻止原生拖拽，把手势交还给 pager。
  try{
   if(APP&&APP.dragPointer!==null&&APP.dragStartX!=null&&APP.lastX!=null){
    var ddx=Math.abs(APP.lastX-APP.dragStartX);
    var ddy=Math.abs((APP.lastY!=null?APP.lastY:APP.dragStartY||0)-(APP.dragStartY||0));
    if(ddx>ddy&&ddx>=8){e.preventDefault();e.stopPropagation();return;}
   }
  }catch(_){}
  var t=e.target.closest&&e.target.closest('[data-mkey],[data-qkey]');
  if(!t)return;dragKey=t.getAttribute(attr==='data-mkey'?'data-mkey':'data-qkey');
  try{e.dataTransfer.setData('text/plain',dragKey);}catch(_){}
  e.dataTransfer.effectAllowed='move';});
 rootEl.addEventListener('dragover',function(e){
  var t=e.target.closest&&e.target.closest('[data-mkey],[data-qkey]');
  if(t&&dragKey){e.preventDefault();}});
 rootEl.addEventListener('drop',function(e){
  var t=e.target.closest&&e.target.closest('[data-mkey],[data-qkey]');
  if(!t||!dragKey)return;e.preventDefault();
  var dk=t.getAttribute(attr==='data-mkey'?'data-mkey':'data-qkey');
  if(dk===dragKey){dragKey=null;return;}
  var fi=orderArr.indexOf(dragKey),ti=orderArr.indexOf(dk);
  if(fi<0||ti<0){dragKey=null;return;}
  orderArr.splice(ti,0,orderArr.splice(fi,1)[0]);
  saveOrder(lsKey,orderArr);dragKey=null;
  try{navigator.vibrate&&navigator.vibrate(8);}catch(_){}
  rerender();});
}
function rerenderDash(){
 var pg=$('#page-dashboard');if(!pg)return;
 pg.innerHTML='';BUILDERS.dashboard(pg);
 requestAnimationFrame(function(){applyPagerTransforms(true);onDataTick();});}
window.__CAM={APP:APP,SENSORS:SENSORS,SIM:SIM,HIST:HIST}; // 诊断/测试专用导出
init();
</script>
