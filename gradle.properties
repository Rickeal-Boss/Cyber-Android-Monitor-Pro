# Project-wide Gradle settings
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.suppressUnsupportedCompileSdk=36,35

# AGP 9.0 启用内置 Kotlin (built-in Kotlin)，默认提供 Kotlin 2.2.10（含 Compose 编译器）。
# 无需 apply org.jetbrains.kotlin.android 插件（AGP 9 已硬禁显式 apply 该插件）。
# compose 编译器随内置 Kotlin 版本，通过 org.jetbrains.kotlin.plugin.compose (2.2.10) 启用。
# 注: 内置 Kotlin 版本由 AGP 9.0.1 固定为 2.2.10；升级到 Kotlin 2.4.x 需 AGP 9.1+。

# Gradle 构建性能: 并行 + 配置缓存
org.gradle.parallel=true
org.gradle.caching=true
