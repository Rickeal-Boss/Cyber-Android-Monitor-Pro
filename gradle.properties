# Project-wide Gradle settings
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.suppressUnsupportedCompileSdk=36,35

# AGP 9.0 new DSL (android.newDsl=true 默认) 与显式 apply org.jetbrains.kotlin.android 插件不兼容
# （插件会访问旧的 BaseExtension 而崩溃）。本项目显式钉 Kotlin 2.4.10（含 compose 插件），
# 故回退到 legacy DSL 以支持显式 KGP：
#   - android.newDsl=false: 允许显式 apply Kotlin 插件（new DSL 下该插件因访问旧 BaseExtension 而失败）
# 注: 此为 AGP 9 的临时绕过方案；AGP 10 移除 legacy DSL 后需迁移到 AGP 内置 Kotlin (builtInKotlin)。
android.newDsl=false

# Gradle 构建性能: 并行 + 配置缓存
org.gradle.parallel=true
org.gradle.caching=true
