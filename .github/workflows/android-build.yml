name: Android Release Build

on:
  push:
    branches: [ main, master, DLC, yingai, II, III, IIII, IIIII, IIIIII, preview, 4.0, 4.0icon, 4.0.404.0, Hy-agent, newth-generation, core-fix, 6.0.606.0.9 ]
    # ★ Debug 预发布包仅 tag 触发：打 v*-debug-pre* 标签时才构建并上传 debug APK，
    #   避免每次分支 push 都多跑一次 assembleDebug + 上传，拖长 CI。
    tags: [ 'v*-debug-pre*' ]
  workflow_dispatch:

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify project structure
        run: |
          echo "=== Checking required files ==="
          MISSING=0
          for f in settings.gradle build.gradle gradlew gradle.properties app/build.gradle; do
            if test -f "$f"; then echo "  ✅ $f"; else echo "  ❌ MISSING: $f"; MISSING=1; fi
          done
          if [ "$MISSING" = "1" ]; then
            echo ""
            echo "🚨 FATAL: Required files missing."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # ★ 2026-08-07: 追加 NDK + CMake — Vulkan 真实扩展枚举探针 (libcybervulkan.so)
          #   ndk;29.0.14206865 = NDK r29 Latest Stable (developer.android.com/ndk/downloads)
          #   必须与 app/build.gradle 的 ndkVersion 完全一致，否则 AGP 报 "NDK not configured"
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools ndk;29.0.14206865 cmake;3.22.1'

      - name: Accept Android SDK licenses
        run: |
          echo "=== Android SDK environment ==="
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo ""
          echo "=== Installed cmdline-tools ==="
          ls -la "${ANDROID_SDK_ROOT}/cmdline-tools/" 2>/dev/null || echo "(no cmdline-tools dir)"
          echo ""

          # Dynamically locate the newest sdkmanager binary.
          # Prefer versioned directories (e.g. 12266719) over 'latest' which may be
          # a stale symlink pointing to the pre-installed 16.0 version.
          SDKMANAGER=$(find "${ANDROID_SDK_ROOT}/cmdline-tools" -name sdkmanager -type f 2>/dev/null \
            | xargs -r ls -t 2>/dev/null \
            | head -1)

          if [ -z "${SDKMANAGER}" ]; then
            echo "::error::sdkmanager not found under ${ANDROID_SDK_ROOT}/cmdline-tools/"
            echo "::error::Try adding 'cmdline-tools' to the setup-android packages list."
            exit 1
          fi

          echo "Using sdkmanager: ${SDKMANAGER}"
          echo ""

          # Accept all licenses non-interactively
          yes | "${SDKMANAGER}" --sdk_root="${ANDROID_SDK_ROOT}" --licenses
          echo ""
          echo "=== License acceptance complete ==="

      # ★ 2026-08-07: NDK 首次引入本项目，构建前先确认工具链就位，
      #   否则 AGP 会在 configure 阶段抛较隐晦的 "NDK not configured" 而难以定位。
      - name: Verify NDK & CMake toolchain
        run: |
          NDK_VER="29.0.14206865"
          echo "=== NDK ==="
          if [ -d "${ANDROID_SDK_ROOT}/ndk/${NDK_VER}" ]; then
            echo "  ✅ ndk/${NDK_VER}"
          else
            echo "::error::NDK ${NDK_VER} not found. Installed NDKs:"
            ls -1 "${ANDROID_SDK_ROOT}/ndk/" 2>/dev/null || echo "  (none)"
            exit 1
          fi
          echo "=== CMake ==="
          ls -1 "${ANDROID_SDK_ROOT}/cmake/" 2>/dev/null || echo "  (none)"
          echo "=== Native sources ==="
          ls -la app/src/main/cpp/

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify signing secrets
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "🚨 KEYSTORE_BASE64 secret is not set!"
            echo "→ Create a keystore: keytool -genkey -v -keystore release.keystore -alias release -keyalg RSA -keysize 2048 -validity 10000"
            echo "→ Encode it:    base64 -w0 release.keystore"
            echo "→ Add to GitHub: Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi

      - name: Build Signed Release APK
        run: ./gradlew assembleRelease
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --continue
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Debug — list APK outputs
        run: find app/build/outputs -name "*.apk" -type f 2>/dev/null || echo "(no APK files found)"

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: device-info-viewer-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      # ★ Debug 预发布包（minifyEnabled=false，默认 debug 签名）：仅 tag 触发（v*-debug-pre*），用于真机 debug-vs-release 崩溃差异测试
      - name: Build Debug APK (no R8 shrink)
        if: startsWith(github.ref, 'refs/tags/')
        run: ./gradlew assembleDebug
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Debug — list debug APK outputs
        if: startsWith(github.ref, 'refs/tags/')
        run: find app/build/outputs -path "*debug*.apk" -type f 2>/dev/null || echo "(no debug APK found)"

      - name: Upload Debug APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: device-info-viewer-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
