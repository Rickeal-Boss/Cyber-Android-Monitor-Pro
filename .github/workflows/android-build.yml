name: Android Release Build

on:
  push:
    branches: [ yingai, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify project structure
        run: |
          echo "=== Checking required files ==="
          MISSING=0
          for f in settings.gradle build.gradle gradlew gradle.properties app/build.gradle; do
            if test -f "$f"; then echo "  ✅ $f"; else echo "  ❌ MISSING: $f"; MISSING=1; fi
          done
          if [ "$MISSING" = "1" ]; then
            echo ""
            echo "🚨 FATAL: Required files missing."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify signing secrets
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "🚨 KEYSTORE_BASE64 secret is not set!"
            echo "→ Create a keystore: keytool -genkey -v -keystore release.keystore -alias release -keyalg RSA -keysize 2048 -validity 10000"
            echo "→ Encode it:    base64 -w0 release.keystore"
            echo "→ Add to GitHub: Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi

      - name: Build Signed Release APK
        run: ./gradlew assembleRelease
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Debug — list APK outputs
        run: find app/build/outputs -name "*.apk" -type f 2>/dev/null || echo "(no APK files found)"

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: device-info-viewer-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
