plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    // Kotlin 2.0+ 强制要求 Compose Compiler 插件
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.example.deviceinfoviewer'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.deviceinfoviewer"
        minSdk 21
        targetSdk 35
        versionCode 2
        versionName "2.0.0"
    }

    // ================================================================
    //  签名配置 (通过环境变量注入，CI 友好)
    //  本地构建时若无环境变量则跳过签名，产出 unsigned APK
    // ================================================================
    def keystoreBase64 = System.getenv("KEYSTORE_BASE64")
    def keystorePassword = System.getenv("KEYSTORE_PASSWORD")
    def keyAlias = System.getenv("KEY_ALIAS")
    def keyPassword = System.getenv("KEY_PASSWORD")

    // 将 keystore 解码写入 build 目录 (保证目录存在、不会被提交)
    def hasSecrets = keystoreBase64 != null && !keystoreBase64.isEmpty()
            && keystorePassword != null && !keystorePassword.isEmpty()
            && keyAlias != null && !keyAlias.isEmpty()
            && keyPassword != null && !keyPassword.isEmpty()

    if (hasSecrets) {
        def keystoreFile = rootProject.file("release.keystore")
        keystoreFile.bytes = keystoreBase64.decodeBase64()

        signingConfigs {
            create("ciRelease") {
                storeFile keystoreFile
                storePassword keystorePassword
                keyAlias keyAlias
                keyPassword keyPassword
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 有签名配置时自动使用；无则产出 unsigned (本地开发)
            if (hasSecrets) {
                signingConfig signingConfigs.ciRelease
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        compose true
    }

    // Compose Compiler 版本由 Kotlin 2.0 plugin.compose 自动管理
    // 无需手动设置 kotlinCompilerExtensionVersion
}

dependencies {
    // ========== Kotlin ==========
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.1.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // ========== AndroidX 基础 ==========
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'

    // ========== Lifecycle ==========
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.4'

    // ========== Activity ==========
    implementation 'androidx.activity:activity-compose:1.9.0'

    // ========== Material Design ==========
    // 已迁移到 Jetpack Compose Material3，旧 Material 库不再需要

    // ========== MPAndroidChart（保留备用）==========
    // implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // ========== JSON ==========
    implementation 'com.google.code.gson:gson:2.10.1'

    // ========== Koin DI ==========
    // 注意: koin-androidx-viewmodel 在 3.x 已合并到 koin-androidx-compose
    // 不要单独添加 koin-androidx-viewmodel（Maven Central 只有 2.x 版本）
    implementation 'io.insert-koin:koin-android:3.5.6'
    implementation 'io.insert-koin:koin-androidx-compose:3.5.6'

    // ========== Jetpack Compose ==========
    // BOM 2024.12.01 与 Kotlin 2.1.0 兼容
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.runtime:runtime-livedata'
    implementation 'androidx.compose.ui:ui-text-google-fonts'

    // ========== Compose 调试 ==========
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
