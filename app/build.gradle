plugins {
    id 'com.android.application' version '8.5.0'
    id 'org.jetbrains.kotlin.android' version '2.1.0'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.1.0'
}

android {
    namespace 'com.example.deviceinfoviewer'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.deviceinfoviewer"
        minSdk 21
        targetSdk 35
        versionCode 202
        versionName "2.0.202.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        compose true
    }
}
